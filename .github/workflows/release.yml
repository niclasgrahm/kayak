# Publishes the container image to GHCR — ghcr.io/niclasgrahm/kayak.
#
# There is no test job here and that is deliberate: `main` is behind a ruleset
# that requires a pull request with `ci` green, so a commit that reaches this
# workflow has already been tested. Re-running the suite would double every
# push's cost to re-answer a question the branch rule has already settled.
#
# Tags follow the commit rather than being written by hand:
#
#   push to main      latest, sha-<short>
#   push of v1.2.3    1.2.3, 1.2, latest, sha-<short>
#
# so `latest` is the tip of main and a release tag is the only thing that ever
# produces a version number.
#
# ---- why this is two jobs and not one `platforms:` line -------------------
#
# The image is built once per architecture on a runner of *that* architecture,
# and the two are then joined into one manifest list. The obvious spelling —
# one job with `platforms: linux/amd64,linux/arm64` — builds the second one
# under QEMU, and a cargo-leptos release build emulated is hours rather than
# minutes. GitHub gives public repositories free arm64 runners, so the honest
# build is also the fast one.
#
# The per-arch job pushes *by digest* and pushes no tag: a tag can only mean
# one thing, and two jobs racing to write `latest` would leave whichever
# finished last, not the manifest list. `merge` is what creates the tags, once
# both digests exist.
name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Publishing by hand, for when a build failed on something that wasn't the
  # commit's fault.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # No tags: this pushes a digest for `merge` to assemble. See the
          # header.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture — one shared scope means each build evicts
          # the other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest is the only thing the next job needs, and an artifact is how
      # it crosses between them. The filename is the digest with its `sha256:`
      # prefix stripped, because a colon is not a filename on every runner.
      - name: export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # One manifest list carrying both architectures, published under every
      # tag the metadata step worked out.
      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: check both architectures are in it
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }} \
            --format '{{ range .Manifest.Manifests }}{{ .Platform.OS }}/{{ .Platform.Architecture }} {{ end }}'
