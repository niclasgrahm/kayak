# Publishes the container image to GHCR — ghcr.io/niclasgrahm/kayak.
#
# There is no test job here and that is deliberate: `main` is behind a ruleset
# that requires a pull request with `ci` green, so a commit that reaches this
# workflow has already been tested. Re-running the suite would double every
# push's cost to re-answer a question the branch rule has already settled.
#
# Tags follow the commit rather than being written by hand:
#
#   push to main      latest, sha-<short>
#   push of v1.2.3    1.2.3, 1.2, latest, sha-<short>
#
# so `latest` is the tip of main and a release tag is the only thing that ever
# produces a version number.
name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Publishing by hand, for when a build failed on something that wasn't the
  # commit's fault.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` to check out; `packages: write` is what lets the
      # built-in GITHUB_TOKEN push to GHCR — no account and no stored
      # credential of our own is involved.
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # linux/amd64 only for now. arm64 through QEMU makes a cargo-leptos
          # release build take hours; the way to add it is a second *native*
          # runner (ubuntu-24.04-arm, free for public repos) and a manifest
          # merge, not a `platforms:` list.
          platforms: linux/amd64
          # Caches the image layers — the apt, rustup and cargo-binstall steps,
          # which is most of a cold build's setup. It does *not* carry the
          # Dockerfile's `RUN --mount=type=cache` directories: buildkit does
          # not export cache mounts, so cargo still compiles the workspace from
          # scratch on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
