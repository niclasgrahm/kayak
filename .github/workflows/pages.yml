# Publishes the doc site to GitHub Pages — https://propell.dev/kayak/
#
# propell.dev is the custom domain on the account's user site, so every project
# page hangs off it; the site's `base` is `/kayak/` to match.
#
# The site's reference tables are generated by `kayak-docsgen` and *committed*,
# which is what lets this job be `npm ci && npm run build` with no Rust
# toolchain. What keeps them from going stale is `docsgen/tests/site.rs`,
# which regenerates in memory and compares — so a stale reference is a red
# `ci`, not a quietly wrong page. That is why this workflow does not
# regenerate anything: by the time a commit is on main, `ci` has already
# said the committed output matches the schemas.
#
# `ci` builds the site on every pull request too. This one only deploys, and
# only from main.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates to Pages with a short-lived OIDC token rather
  # than a stored secret; this is what lets it mint one.
  id-token: write

# A queued deploy is superseded by a newer one rather than both landing in an
# order nobody chose. `cancel-in-progress: false` because cancelling *mid
# deploy* can leave the site half-published — better to let it finish and have
# the next one replace it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated: true in the vitepress config reads each page's git
          # timestamp, which a shallow clone does not have — without this
          # every page claims it was updated at the moment of the build.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - run: npm run build
        working-directory: website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
