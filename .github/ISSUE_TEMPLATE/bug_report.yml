name: bug report
description: something behaves differently from how it's documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, please don't file it here — see
        [SECURITY.md](https://github.com/niclasgrahm/kayak/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: what happened
      description: and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: how to reproduce it
      description: >
        The most useful thing is the smallest config that shows it. Please
        redact your secrets — kayak's config only holds `${NAME}` references,
        but a connections file may hold hosts you'd rather not post.
      render: yaml
  - type: input
    id: version
    attributes:
      label: version
      description: a release tag, an image tag, or a commit sha
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: anything in the log
      description: >
        `--debug` turns up the detail. A pipeline's card also keeps a failure
        history, which is often more specific than the log.
      render: text
