name: feature request
description: something kayak should be able to do and can't
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth a look at [the roadmap](https://github.com/niclasgrahm/kayak/blob/main/docs/roadmap.md)
        first — it's the current list of what's in flight, planned, or a known
        gap, and it may already be there.
  - type: textarea
    id: problem
    attributes:
      label: what are you trying to do
      description: >
        The problem rather than the solution, if you can. A lot of this project
        is shaped by which of two readings of a request was the real one.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: how are you working around it today
      description: or "I'm not — I stopped"
