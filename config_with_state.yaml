state:
  guppy_state:
    max_keys: 1

pipelines:
  - id: inanely-many-guppy
    state:
      bucket: guppy_state
    inputs:
      - type: dummy
        duration: 1
    transforms:
      - type: remember
        remember:
          - field: value
            as: latest
    outputs: []

  # The reader. Nothing connects these two pipelines — no `pipeline` input, no
  # edge on the canvas — they meet only through the bucket they both name.
  - id: stamped-ingest
    state:
      # the same bucket, and keyed the same way (which here is "not keyed", so
      # both see the one bucket-wide value). Two pipelines sharing a bucket have
      # to agree about the key; nothing checks that they do.
      bucket: guppy_state
    inputs:
      - type: http
    transforms:
      - type: recall
        recall: [latest]
        # quotes are load-bearing: bare `null` is a YAML null, not this variant.
        # It means "pass the message on with `latest: null`" — the alternative,
        # the default `skip`, would silently drop everything posted before the
        # other pipeline had remembered anything.
        on_missing: 'null'
    outputs:
      - type: stdout
