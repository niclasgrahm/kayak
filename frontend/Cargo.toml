[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.150"
streamer-core = { path = "../streamer-core" }
leptos = { version = "0.8"}
leptos_meta = "0.8"
leptos_router = "0.8"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
gloo-net = "0.7.0"
leptos-use = "0.16"
codee = { version = "0.3", features = ["json_serde"]}

[dev-dependencies]
# `?` in the pure-logic unit tests, so a failed setup step reads as an error
# rather than as an unwrap
anyhow = "1"

[features]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "leptos-use/ssr"]

