- id: sensors
  inputs:
  - type: nats
    urls: nats://localhost:4222
    subject: test.subject
  transforms: []
  outputs:
  - type: stdout
- id: heartbeat
  inputs:
  - type: dummy
    duration: 1
  transforms: []
  outputs:
  - type: stdout
- id: sensors_60s_sum
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: tumbling
      window_seconds: 60
  transforms:
  - type: reducer
    function: sum
    field: value
  outputs:
  - type: postgres
    host: localhost
    database: kayak
    user: kayak
    password: ${POSTGRES_PASSWORD}
    table: sensor_sums
    port: 5432
- id: sensors_10s_avg
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: tumbling
      window_seconds: 10
  transforms:
  - type: reducer
    function: avg
    field: value
  outputs:
  - type: stdout
- id: sensors_100_max
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: static
      size: 100
  transforms:
  - type: reducer
    function: max
    field: value
  outputs:
  - type: nats
    urls: nats://localhost:4222
    subject: test.aggregated.max
- id: hot_readings
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: filter
    Numeric:
      field: value
      operator: GreaterThan
      value: 90.0
  outputs:
  - type: postgres
    host: localhost
    database: kayak
    user: kayak
    password: ${POSTGRES_PASSWORD}
    table: hot_readings
    port: 5432
- id: tagged_readings
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: filter
    String:
      field: ts
      operator: Contains
      value: 'T08:'
  outputs:
  - type: stdout
- id: hot_alerts
  inputs:
  - type: pipeline
    upstream: hot_readings
    buffer:
      type: tumbling
      window_seconds: 60
  transforms:
  - type: http
    url: http://localhost:8080/alerts
    verb: POST
  outputs:
  - type: stdout
- id: sensors_archive
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: static
      size: 10
  transforms: []
  outputs:
  - type: postgres
    host: localhost
    database: kayak
    user: kayak
    password: ${POSTGRES_PASSWORD}
    table: readings
    port: 5432
  - type: stdout
- id: everything
  inputs:
  - type: pipeline
    upstream: sensors
  - type: pipeline
    upstream: heartbeat
  - type: nats
    urls: nats://localhost:4222
    subject: test.aggregated.max
  transforms: []
  outputs:
  - type: stdout
  - type: nats
    urls: nats://localhost:4222
    subject: test.everything
- id: kafka_events
  inputs:
  - type: kafka
    brokers: localhost:9092
    topic: test.events
    group: kayak-sample
    start_at: latest
  transforms: []
  outputs:
  - type: stdout
- id: slow_requests
  inputs:
  - type: pipeline
    upstream: kafka_events
  transforms:
  - type: filter
    Numeric:
      field: latency_ms
      operator: GreaterThan
      value: 400.0
  outputs:
  - type: kafka
    brokers: localhost:9092
    topic: test.slow
  - type: stdout
- id: heartbeat_pairs
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: buffer
    size: 6
  - type: splitter
    out_size: 2
  outputs:
  - type: stdout
