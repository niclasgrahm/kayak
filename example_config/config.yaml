state:
  heartbeat_peaks:
    max_keys: 1
  sensor_state:
    max_keys: 500
    idle_timeout_secs: 3600
pipelines:
- id: heartbeat
  inputs:
  - type: dummy
    duration: 1
    payload: number
    amplitude: 10.0
    period: 60.0
  transforms: []
  outputs:
  - type: stdout
- id: ingest
  inputs:
  - type: http
    envelope:
      type: wrap
      payload: body
  transforms: []
  outputs:
  - type: stdout
- id: kafka_events
  inputs:
  - type: kafka
    connection: local-kafka
    topic: test.events
    group: kayak-sample
    start_at: latest
    max_batch: 500
    envelope:
      type: merge
  transforms: []
  outputs:
  - type: stdout
- id: sensors
  inputs:
  - type: nats
    connection: local-nats
    subject: test.subject
    max_batch: 500
    envelope:
      type: merge
  transforms: []
  outputs:
  - type: stdout
- id: everything
  inputs:
  - type: pipeline
    upstream: sensors
  - type: pipeline
    upstream: heartbeat
  - type: nats
    connection: local-nats
    subject: test.aggregated.max
    max_batch: 500
  transforms: []
  outputs:
  - type: stdout
  - type: nats
    connection: local-nats
    subject: test.everything
- id: heartbeat_pairs
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: buffer
    size: 6
  - type: splitter
    out_size: 2
  outputs:
  - type: stdout
- id: heartbeat_peaks
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: remember
    when:
    - type: numeric
      field: value
      operator: GreaterThan
      value: 8.0
    remember:
    - field: value
      as: last_peak
    - field: current_time
      as: last_peak_at
  - type: recall
    recall:
    - last_peak
    - last_peak_at
    on_missing: 'null'
  outputs:
  - type: stdout
  state:
    bucket: heartbeat_peaks
- id: heartbeat_shaped
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: map
    mappings:
    - type: constant
      as: line
      value:
        type: text
        value: line-3
    # reads `line`, which the mapping above wrote: mappings apply in order
    - type: concat
      as: asset
      parts:
      - type: value
        value: heartbeat/
      - type: field
        field: line
    - type: copy
      from: current_time
      as: observed_at
    # (value * 1.8) + 32 in two steps through an intermediate the last
    # mapping drops again — one operation per mapping, deliberately
    - type: arithmetic
      as: _scaled
      operator: multiply
      left:
        type: field
        field: value
      right:
        type: value
        value: 1.8
    - type: arithmetic
      as: fahrenheit
      operator: add
      left:
        type: field
        field: _scaled
      right:
        type: value
        value: 32.0
    - type: cast
      from: value
      to: text
      as: value_text
    - type: drop
      from:
      - _scaled
      - current_time
  outputs:
  - type: stdout
- id: sensors_projected
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  # the other shape: only the mapped fields come out, which is what
  # prepares a message for an output with a shape of its own
  - type: map
    keep: mapped
    on_missing: omit
    mappings:
    - type: copy
      from: _meta.subject
    - type: copy
      from: sensor
    - type: coalesce
      as: reading
      from:
      - value
      - reading
    - type: copy
      from: ts
      as: recorded_at
  outputs:
  - type: stdout
- id: heartbeat_to_disk
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms: []
  outputs:
  - type: file
    connection: local-files
    path: heartbeat
    format: ndjson
    rotate:
      max_rows: 20
      interval_secs: 60
- id: heartbeat_to_s3
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms: []
  outputs:
  - type: s3
    connection: local-s3
    prefix: heartbeat
    format: ndjson
    rotate:
      max_rows: 20
      interval_secs: 60
- id: hot_readings
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: filter
    Numeric:
      field: value
      operator: GreaterThan
      value: 90.0
  outputs:
  - type: postgres
    connection: local-postgres
    table: hot_readings
    columns:
    - name: sensor
      type: text
      nullable: false
    - name: value
      type: float
      nullable: false
    - name: recorded_at
      type: timestamp
      field: ts
    - name: subject
      type: text
      field: _meta.subject
    - name: raw
      type: json
      message: true
    indexes:
    - columns:
      - recorded_at
- id: sensor_state
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: remember
    remember:
    - field: value
      as: last_value
    - field: ts
      as: last_seen
  outputs: []
  state:
    bucket: sensor_state
    key: sensor
- id: sensors_100_max
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: static
      size: 100
  transforms:
  - type: reducer
    aggregations:
    - function: max
      as: value
      field: value
    - function: count
      as: readings
    - function: max
      as: last_seen
      field: ts
  outputs:
  - type: nats
    connection: local-nats
    subject: test.aggregated.max
- id: sensors_10s_avg
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: tumbling
      window_seconds: 10
  transforms:
  - type: reducer
    aggregations:
    - function: avg
      as: mean
      field: value
    - function: min
      as: lowest
      field: value
    - function: max
      as: highest
      field: value
    - function: count
      as: readings
    group_by:
    - sensor
    - _meta.subject
    on_missing: skip
  outputs:
  - type: stdout
- id: sensors_60s_sum
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: tumbling
      window_seconds: 60
  transforms:
  - type: reducer
    aggregations:
    - function: sum
      as: total
      field: value
    - function: median
      as: median
      field: value
    - function: count_distinct
      as: sensors
      field: sensor
  outputs:
  - type: postgres
    connection: local-postgres
    table: sensor_sums
    columns:
    - name: total
      type: float
    - name: median
      type: float
    - name: sensors
      type: integer
- id: sensors_archive
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: static
      size: 10
  transforms: []
  outputs:
  - type: postgres
    connection: local-postgres
    table: readings
  - type: stdout
- id: slow_requests
  inputs:
  - type: pipeline
    upstream: kafka_events
  transforms:
  - type: filter
    Numeric:
      field: latency_ms
      operator: GreaterThan
      value: 400.0
  outputs:
  - type: kafka
    connection: local-kafka
    topic: test.slow
  - type: stdout
- id: tagged_readings
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: filter
    String:
      field: ts
      operator: Contains
      value: 'T08:'
  outputs:
  - type: stdout
- id: hot_alerts
  inputs:
  - type: pipeline
    upstream: hot_readings
    buffer:
      type: tumbling
      window_seconds: 60
  transforms:
  - type: http
    url: http://localhost:8080/alerts
    verb: POST
  outputs:
  - type: stdout
