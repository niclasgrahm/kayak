state:
  heartbeat_peaks:
    max_keys: 1
  heartbeat_swings:
    max_keys: 1
  sensor_state:
    max_keys: 500
    idle_timeout_secs: 3600
pipelines:
- id: heartbeat
  inputs:
  - type: dummy
    duration: 1
    payload: number
    amplitude: 10.0
    period: 60.0
  transforms: []
  outputs:
  - type: stdout
- id: ingest
  inputs:
  - type: http
    envelope:
      type: wrap
      payload: body
  transforms: []
  outputs:
  - type: stdout
- id: kafka_events
  inputs:
  - type: kafka
    connection: local-kafka
    topic: test.events
    group: kayak-sample
    start_at: latest
    max_batch: 500
    envelope:
      type: merge
    ack: on_delivery
  transforms: []
  outputs:
  - type: stdout
- id: mqtt_events
  inputs:
  - type: mqtt
    connection: local-mqtt
    topic: test.mqtt
    qos: at_least_once
    envelope:
      type: merge
    ack: on_delivery
  transforms: []
  outputs:
  - type: stdout
- id: redis_events
  inputs:
  - type: redis
    connection: local-redis
    channel: test.redis
    envelope:
      type: merge
  transforms: []
  outputs:
  - type: stdout
- id: opcua_line1
  inputs:
  - type: opcua
    connection: local-opcua
    nodes:
    - node_id: ns=3;s=FastUInt1
      name: line1_units
    - node_id: ns=3;s=FastUInt2
      name: line2_units
    - node_id: ns=3;s=SlowUInt1
      name: tank_level
    publish_interval_ms: 1000
    max_batch: 100
  transforms: []
  outputs:
  - type: stdout
- id: opcua_anomalies
  inputs:
  - type: opcua
    connection: local-opcua
    browse:
      root: ns=3;s=Anomaly
      depth: 2
    deadband: 1.0
    max_batch: 100
    envelope:
      type: merge
  transforms: []
  outputs:
  - type: stdout
- id: sensors
  inputs:
  - type: nats
    connection: local-nats
    subject: test.subject
    max_batch: 500
    envelope:
      type: merge
  transforms: []
  outputs:
  - type: stdout
- id: broken_aggregate
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: reducer
    aggregations:
    - function: sum
      as: total_temperature
      field: temperature
  outputs:
  - type: stdout
- id: broken_cast
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: map
    mappings:
    - type: cast
      from: current_time
      to: float
      as: current_time_number
  outputs:
  - type: stdout
- id: broken_intermittently
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: filter
    Numeric:
      field: value
      operator: greater_than
      value: 8.0
  - type: map
    mappings:
    - type: cast
      from: current_time
      to: integer
      as: tick
  outputs:
  - type: stdout
- id: broken_webhook
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: http
    url: http://127.0.0.1:59999/alerts
    verb: POST
  outputs:
  - type: stdout
- id: everything
  inputs:
  - type: pipeline
    upstream: sensors
  - type: pipeline
    upstream: heartbeat
  - type: nats
    connection: local-nats
    subject: test.aggregated.max
    max_batch: 500
  transforms: []
  outputs:
  - type: stdout
  - type: nats
    connection: local-nats
    subject: test.everything
- id: heartbeat_banded
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: script
    source:
      type: inline
      code: |
        msg.band = if msg.value > 7.0 { "high" } else if msg.value < -7.0 { "low" } else { "normal" };
        msg
  outputs:
  - type: stdout
- id: heartbeat_extremes
  inputs:
  - type: pipeline
    upstream: heartbeat
    buffer:
      type: tumbling
      window_seconds: 10
  transforms:
  - type: script
    source:
      type: file
      path: scripts/extremes.rhai
    scope: batch
  outputs:
  - type: stdout
- id: heartbeat_pairs
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: buffer
    size: 6
  - type: splitter
    out_size: 2
  outputs:
  - type: stdout
- id: heartbeat_peaks
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: remember
    when:
    - type: numeric
      field: value
      operator: greater_than
      value: 8.0
    remember:
    - field: value
      as: last_peak
    - field: current_time
      as: last_peak_at
  - type: recall
    recall:
    - last_peak
    - last_peak_at
    on_missing: 'null'
  outputs:
  - type: stdout
  state:
    bucket: heartbeat_peaks
- id: heartbeat_shaped
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: map
    mappings:
    - type: constant
      value:
        type: text
        value: line-3
      as: line
    - type: concat
      parts:
      - type: value
        value: heartbeat/
      - type: field
        field: line
      as: asset
    - type: copy
      from: current_time
      as: observed_at
    - type: arithmetic
      left:
        type: field
        field: value
      operator: multiply
      right:
        type: value
        value: 1.8
      as: _scaled
    - type: arithmetic
      left:
        type: field
        field: _scaled
      operator: add
      right:
        type: value
        value: 32.0
      as: fahrenheit
    - type: cast
      from: value
      to: text
      as: value_text
    - type: drop
      from:
      - _scaled
      - current_time
  outputs:
  - type: stdout
- id: heartbeat_swings
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms:
  - type: script
    source:
      type: file
      path: scripts/swings.rhai
  outputs:
  - type: stdout
  state:
    bucket: heartbeat_swings
- id: heartbeat_to_disk
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms: []
  outputs:
  - type: file
    connection: local-files
    path: heartbeat
    format: ndjson
    rotate:
      max_rows: 20
      interval_secs: 60
- id: heartbeat_to_redis
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms: []
  outputs:
  - type: redis
    connection: local-redis
    channel: heartbeat
- id: heartbeat_to_s3
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms: []
  outputs:
  - type: s3
    connection: local-s3
    prefix: heartbeat
    format: ndjson
    rotate:
      max_rows: 20
      interval_secs: 60
- id: heartbeat_to_webhook
  inputs:
  - type: pipeline
    upstream: heartbeat
  transforms: []
  outputs:
  - type: http
    url: http://127.0.0.1:6767/api/pipelines/ingest/messages
    body: batch
- id: hot_readings
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: filter
    Numeric:
      field: value
      operator: greater_than
      value: 90.0
  outputs:
  - type: postgres
    connection: local-postgres
    table: hot_readings
    columns:
    - name: sensor
      type: text
      nullable: false
    - name: value
      type: float
      nullable: false
    - name: recorded_at
      type: timestamp
      field: ts
    - name: subject
      type: text
      field: _meta.subject
    - name: raw
      type: json
      message: true
    indexes:
    - columns:
      - recorded_at
- id: sensor_state
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: remember
    remember:
    - field: value
      as: last_value
    - field: ts
      as: last_seen
  outputs: []
  state:
    bucket: sensor_state
    key: sensor
- id: sensors_100_max
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: static
      size: 100
  transforms:
  - type: reducer
    aggregations:
    - function: max
      as: value
      field: value
    - function: count
      as: readings
    - function: max
      as: last_seen
      field: ts
  outputs:
  - type: nats
    connection: local-nats
    subject: test.aggregated.max
- id: opcua_line1_10s_avg
  inputs:
  - type: pipeline
    upstream: opcua_line1
    buffer:
      type: tumbling
      window_seconds: 10
  transforms:
  - type: reducer
    group_by:
    - name
    on_missing: skip
    aggregations:
    - function: avg
      field: value
      as: mean
    - function: max
      field: value
      as: highest
    - function: max
      field: source_timestamp
      as: last_seen
    - function: count
      as: readings
  outputs:
  - type: stdout
- id: sensors_10s_avg
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: tumbling
      window_seconds: 10
  transforms:
  - type: reducer
    aggregations:
    - function: avg
      as: mean
      field: value
    - function: min
      as: lowest
      field: value
    - function: max
      as: highest
      field: value
    - function: count
      as: readings
    group_by:
    - sensor
    - _meta.subject
    on_missing: skip
  outputs:
  - type: stdout
- id: sensors_60s_sum
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: tumbling
      window_seconds: 60
  transforms:
  - type: reducer
    aggregations:
    - function: sum
      as: total
      field: value
    - function: median
      as: median
      field: value
    - function: count_distinct
      as: sensors
      field: sensor
  outputs:
  - type: postgres
    connection: local-postgres
    table: sensor_sums
    columns:
    - name: total
      type: float
    - name: median
      type: float
    - name: sensors
      type: integer
- id: sensors_archive
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: batch
      size: 10
      window_seconds: 30
  transforms: []
  outputs:
  - type: postgres
    connection: local-postgres
    table: readings
  - type: stdout
- id: sensors_projected
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: map
    mappings:
    - type: copy
      from: _meta.subject
    - type: copy
      from: sensor
    - type: coalesce
      from:
      - value
      - reading
      as: reading
    - type: copy
      from: ts
      as: recorded_at
    keep: mapped
    on_missing: omit
  outputs:
  - type: stdout
- id: sensors_to_clickhouse
  inputs:
  - type: pipeline
    upstream: sensors
    buffer:
      type: batch
      size: 100
      window_seconds: 5
  transforms: []
  outputs:
  - type: clickhouse
    connection: local-clickhouse
    table: sensor_readings
    columns:
    - name: sensor
      type: text
    - name: value
      type: float
    - name: recorded_at
      type: timestamp
      field: ts
    - name: subject
      type: text
      field: _meta.subject
    - name: raw
      type: json
      message: true
    order_by:
    - recorded_at
    - sensor
- id: slow_requests
  inputs:
  - type: pipeline
    upstream: kafka_events
  transforms:
  - type: filter
    Numeric:
      field: latency_ms
      operator: greater_than
      value: 400.0
  outputs:
  - type: kafka
    connection: local-kafka
    topic: test.slow
  - type: stdout
- id: tagged_readings
  inputs:
  - type: pipeline
    upstream: sensors
  transforms:
  - type: filter
    String:
      field: ts
      operator: contains
      value: 'T08:'
  outputs:
  - type: stdout
- id: hot_alerts
  inputs:
  - type: pipeline
    upstream: hot_readings
    buffer:
      type: tumbling
      window_seconds: 60
  transforms:
  - type: http
    url: http://localhost:8080/alerts
    verb: POST
  outputs:
  - type: stdout
