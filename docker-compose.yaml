services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"

  # single-node KRaft broker — no zookeeper. two listeners because the host and
  # the other containers reach it by different names: the server running under
  # `cargo leptos watch` connects to localhost:9092, the publisher below to
  # kafka:29092.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # a one-broker cluster can't replicate anything
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # don't make a new consumer group wait out the rebalance delay
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # the kafka equivalent of the nats publisher: one json log line a second on
  # test.events, which the `kafka_events` pipeline in example_config/config.json consumes
  kafka-publisher:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "{\"ts\":\"$(date -Iseconds)\",\"service\":\"checkout\",\"latency_ms\":$((RANDOM % 500))}"
          sleep 1
        done | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:29092 --topic test.events

  # the postgres output in example_config/config.json writes here. the password
  # is what ${POSTGRES_PASSWORD} has to resolve to — see
  # example_config/secrets.example.json
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kayak
      POSTGRES_USER: kayak
      POSTGRES_PASSWORD: hunter2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayak -d kayak"]
      interval: 5s
      timeout: 3s
      retries: 10

  # an S3-compatible object store for the `s3` output to write into, so the
  # object-store path can be exercised without an AWS account. Single drive and
  # no console — this is a target for writes, not a deployment.
  #
  # 9000 is the S3 API. The credentials are what ${S3_ACCESS_KEY_ID} and
  # ${S3_SECRET_ACCESS_KEY} have to resolve to — see
  # example_config/secrets.example.json. They are the well-known defaults on
  # purpose: this listens on localhost and holds test data.
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_OBS_LOGGER_LEVEL: warn
    # tmpfs rather than a named volume, and not only for throwaway-ness: rustfs
    # runs as uid 10001 and docker creates a named volume's directory owned by
    # root, so the upstream compose needs a helper container to chown it first.
    # A tmpfs comes up world-writable and needs no such thing. The cost is that
    # the bucket is empty again after a `docker compose down`, which is what you
    # want from a fixture anyway.
    tmpfs:
      - /data/rustfs0:size=512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # the bucket the `events_to_s3` pipeline writes into. An output creates
  # objects and never buckets, so something has to make it once; this exits as
  # soon as it has, and `mb --ignore-existing` makes a second `up` a no-op.
  rustfs-bucket:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
        mc mb --ignore-existing local/events &&
        echo "bucket 'events' ready"

  publisher:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    entrypoint: ["sh", "-c"]
    command:
      - |
        # the sensor id is what the sample's grouping reducer groups by, so
        # there has to be more than one of them.
        #
        # `$$` is how a variable reaches the *shell*: compose interpolates a
        # bare `$name` itself and there is no `sensor` in its environment, so
        # `$sensor` published an empty id and `$sensors` left shuf with nothing
        # to pick from. Command substitution is left alone by compose, which is
        # why `$(date)` beside it needs no escaping.
        sensors="north south east west"
        while true; do
          sensor=$$(echo $$sensors | tr ' ' '\n' | shuf -n 1)
          nats --server nats://nats:4222 pub test.subject "{\"ts\":\"$(date -Iseconds)\",\"sensor\":\"$$sensor\",\"value\":$((RANDOM % 101))}"
          sleep 1
        done
