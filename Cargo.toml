[workspace]
members = ["kayak-core", "frontend"]

[package]
name = "kayak"
version = "0.1.0"
edition = "2024"

[lints.clippy]
# Groups (lower priority so individual lints below can override them)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Restriction lints — opt in individually
unwrap_used = "warn"
expect_used = "warn"

# Turn off a few pedantic lints that are mostly noise while learning
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Keeps `target/` from growing without bound. Cargo never collects old
# artifacts, and this workspace compiles its whole tree three times over
# (native, wasm32, and cargo-leptos' separate front build), so the dev profile's
# debug info is what actually fills the disk.
#
# `packed` puts it in one .dSYM per artifact instead of leaving a loose .o per
# codegen unit next to it — macOS's default is `unpacked`, which had left 201k
# orphaned object files here. `line-tables-only` keeps file-and-line backtraces,
# which is what a panic or a failing test needs; stepping through lldb and
# inspecting locals is what it gives up. Raise to `debug = true` for a session
# if you need that.
[profile.dev]
split-debuginfo = "packed"
debug = "line-tables-only"

[[workspace.metadata.leptos]]
name = "kayak"
bin-package = "kayak"
lib-package = "frontend"
bin-features = []
lib-features = ["hydrate"]
site-addr = "127.0.0.1:6767"
reload-port = 3001
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
# copied verbatim into `site-root`. It holds the vendored API-reference
# renderer, which `/api/reference` loads from this server rather than a CDN so
# that an offline `just dev` still serves a working reference.
assets-dir = "assets"

[dependencies]
kayak-core = { path = "kayak-core" }
anyhow = "1.0.102"
askama = "0.16.0"
async-nats = "0.48.0"
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
petname = "3.0.0"
# `query` is what the clickhouse output builds its request with: the statement
# travels in the query string of the HTTP interface, so it has to be encoded by
# something that is not string concatenation.
reqwest = { version = "0.13.4", features = ["json", "query"]}
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = {version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
frontend = { path = "frontend", features =["ssr"]}
leptos = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
leptos_meta = { version = "0.8", features = ["ssr"]}
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
rdkafka = { version = "0.39.0", features = ["tokio"] }
serde_norway = "0.9.42"
rand = "0.10"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
base64 = "0.22"
subtle = "2"

[dev-dependencies]
# lets the integration tests call the axum router in-process, with no socket
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# a real directory to write a --config file into, cleaned up on drop
tempfile = "3"

