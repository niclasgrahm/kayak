[package]
name = "streamer"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "warn"

[dependencies]
anyhow = "1.0.102"
async-nats = "0.48.0"
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
petname = "3.0.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
