[workspace]
members = ["streamer-core", "frontend"]

[package]
name = "streamer"
version = "0.1.0"
edition = "2024"

[lints.clippy]
# Groups (lower priority so individual lints below can override them)
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Restriction lints — opt in individually
unwrap_used = "warn"
expect_used = "warn"

# Turn off a few pedantic lints that are mostly noise while learning
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[workspace.metadata.leptos]]
name = "streamer"
bin-package = "streamer"
lib-package = "frontend"
bin-features = []
lib-features = ["hydrate"]
site-addr = "127.0.0.1:6767"
reload-port = 3001
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"

[dependencies]
streamer-core = { path = "streamer-core" }
anyhow = "1.0.102"
askama = "0.16.0"
async-nats = "0.48.0"
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
petname = "3.0.0"
reqwest = { version = "0.13.4", features = ["json"]}
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = {version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
frontend = { path = "frontend", features =["ssr"]}
leptos = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
leptos_meta = { version = "0.8", features = ["ssr"]}
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
rdkafka = { version = "0.39.0", features = ["tokio"] }

[dev-dependencies]
# lets the integration tests call the axum router in-process, with no socket
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

